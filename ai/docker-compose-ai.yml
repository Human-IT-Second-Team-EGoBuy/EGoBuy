services:
  orchestrator:
    build: ./services/orchestrator
    ports:
      - "8000:8000"
    env_file:
      - ./.env
      - ./services/orchestrator/.env
    environment:
      - LIRIOPE_URL=http://model-liriope:8010/predict
      - WAMBUGU_URL=http://model-wambugu:8020/predict
      - EMBEDDER_BASE_URL=http://embedder:8030
    depends_on:
      - model-liriope
      - model-wambugu
      - embedder
    networks: # 추가
      - matefarm-network

  model-liriope:
    build: ./services/model-liriope
    ports:
      - "8010:8010"
    volumes:
      - ./examples/images:/test-images:ro
      - "D:/hf-cache:/hf"
    environment:
      - HF_HOME=/hf
      - HF_HUB_CACHE=/hf/hub
      - TRANSFORMERS_CACHE=/hf/transformers
    networks: # 추가
      - matefarm-network

  model-wambugu:
    build: ./services/model-wambugu
    ports:
      - "8020:8020"
    volumes:
      - ./examples/images:/test-images:ro
      - "D:/hf-cache:/hf"
    environment:
      - HF_HOME=/hf
      - HF_HUB_CACHE=/hf/hub
      - TRANSFORMERS_CACHE=/hf/transformers
    networks: # 추가
      - matefarm-network

  embedder:
    build: ./services/embedder
    ports: 
      - "8030:8030"
    volumes:
      - ./services/embedder/data/chroma_db:/chroma
    environment:
      - CHROMA_PERSIST_DIR=/chroma
    networks: # 추가
      - matefarm-network

# 두 개의 Docker-compose 환경을 이어주기 위한 external Network 를 정의
networks:
  matefarm-network:
    external: true
