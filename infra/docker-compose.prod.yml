version: '3.9'

services:
  backend:
    image: ${BACKEND_IMAGE}
    container_name: backend
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      RDS_ENDPOINT: ${RDS_ENDPOINT}
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks: # 추가
      - matefarm-network

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: frontend
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "80:80"
    networks: # 추가
      - matefarm-network

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks: # 추가
      - matefarm-network

# 두 개의 Docker-compose 환경을 이어주기 위한 external Network 정의
networks:
  matefarm-network:
    external: true  # 이미 존재하는 network를 사용. 따라서 docker-compose up 하기 전에 미리 네트워크 만들어놔야함.
    #docker network create matefarm-network