version: "3.9"

services:
  # =========================
  # DB
  # =========================
  db:
    image: mariadb:10.11
    container_name: db
    environment:
      MARIADB_ROOT_PASSWORD: matefarm
      MARIADB_DATABASE: matefarm
      MARIADB_USER: matefarm
      MARIADB_PASSWORD: matefarm
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
      # - ../db/matefarm_ddl.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-pmatefarm"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - matefarm-network

  # =========================
  # Redis
  # =========================
  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - matefarm-network

  # =========================
  # AI stack
  # =========================
  orchestrator:
    build: ../ai/services/orchestrator
    container_name: orchestrator
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../ai/.env 
    environment:
      MODEL_BASE_URL: http://model-service:8010/predict
      EMBEDDER_BASE_URL: http://embedder:8030
      DIAG_LLM_ENABLED: "1"
      CHAT_LLM_ENABLED: "1"
    depends_on:
      - model-service
      - embedder
    networks:
      - matefarm-network

  model-service:
    build: ../ai/services/model-service
    container_name: model-service
    restart: unless-stopped
    ports:
      - "8010:8010"
    env_file:
      - ../ai/.env 
    environment:
      DEVICE: cpu
      WEIGHTS_PATH: /weights/best_model_epoch8_NEW.pth
    volumes:
      - ../ai/services/model-service/weights:/weights:ro
    networks:
      - matefarm-network

  embedder:
    build: ../ai/services/embedder
    container_name: embedder
    restart: unless-stopped
    ports:
      - "8030:8030"
    env_file:
      - ../ai/.env 
    volumes:
      - ../ai/services/embedder/data/chroma_db:/chroma
    environment:
      CHROMA_PERSIST_DIR: /chroma
    networks:
      - matefarm-network

  # =========================
  # Backend (Spring)
  # =========================
  backend:
    build: ../backend/matefarm
    container_name: backend
    env_file:
      - ../backend/matefarm/.env 
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/matefarm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=utf8
      FASTAPI_BASE_URL: http://orchestrator:8000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FRONT_ROOT_URL: http://localhost
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      orchestrator:
        condition: service_started
    networks:
      - matefarm-network

  # =========================
  # Frontend
  # =========================
  frontend:
    build: ../frontend
    container_name: frontend
    env_file:
      - ../frontend/.env
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - matefarm-network

volumes:
  dbdata:

networks:
  matefarm-network:
    driver: bridge